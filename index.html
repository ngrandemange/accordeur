<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accordeur">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Accordeur</title>
<style>
:root{--bg:#0b0f14;--fg:#e8eef5;--mut:#7d8a99;--ok:#2ee59d;--warn:#ffb020;--bad:#ff5d5d;--card:#151b23}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none}
header{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;padding:12px 0}
h1{font-size:18px;margin:0;font-weight:600}
.ref{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.ref button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:20px}
main{flex:1;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#note{font-size:120px;font-weight:700;line-height:1;transition:color .15s}
#note small{font-size:40px;font-weight:500;vertical-align:top}
#freq{color:var(--mut);font-size:18px;font-variant-numeric:tabular-nums;min-height:24px}
.meter{width:100%;max-width:340px}
#needle line{transition:stroke .15s}
#cents{font-size:22px;font-variant-numeric:tabular-nums;min-height:28px}
.strings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.strings button{min-width:52px;padding:10px 0;border-radius:10px;border:0;background:var(--card);color:var(--fg);font-size:16px}
.strings button.auto{color:var(--mut)}
.strings button.auto.on{color:var(--fg)}
#play{padding:12px 26px;font-size:17px;border:0;border-radius:12px;background:var(--card);color:var(--fg)}
#play:disabled{opacity:.4}
#play.on{background:var(--warn);color:#201400}
.strings button.near{background:#233042}
.strings button.on{outline:2px solid var(--ok)}
#start{padding:16px 40px;font-size:20px;border:0;border-radius:14px;background:var(--ok);color:#04130c;font-weight:700}
#msg{color:var(--mut);text-align:center;font-size:14px;min-height:20px}
.modes{display:flex;gap:8px}
.modes button{padding:8px 14px;border-radius:20px;border:0;background:var(--card);color:var(--mut)}
.modes button.on{background:var(--fg);color:var(--bg)}
</style>
</head>
<body>
<header>
  <h1>Accordeur</h1>
  <div class="ref"><button id="m">−</button><span id="a4">A4 = 440 Hz</span><button id="p">+</button></div>
</header>
<main>
  <div class="modes"><button data-mode="alto">Alto</button><button data-mode="violon">Violon</button><button data-mode="chro">Chromatique</button><button data-mode="guit">Guitare</button></div>
  <div id="note">–</div>
  <div id="freq"></div>
  <div class="meter"><svg id="gauge" viewBox="0 0 300 165" width="100%"><path d="M41.2 99.3A120 120 0 0 1 99.8 41.0" stroke="#ff5d5d55" stroke-width="16" fill="none"/><path d="M99.8 41.0A120 120 0 0 1 125.0 32.6" stroke="#ffb02077" stroke-width="16" fill="none"/><path d="M125.0 32.6A120 120 0 0 1 175.0 32.6" stroke="#2ee59d" stroke-width="16" fill="none"/><path d="M175.0 32.6A120 120 0 0 1 200.2 41.0" stroke="#ffb02077" stroke-width="16" fill="none"/><path d="M200.2 41.0A120 120 0 0 1 258.8 99.3" stroke="#ff5d5d55" stroke-width="16" fill="none"/><line x1="150.0" y1="41.0" x2="150.0" y2="62.0" stroke="#e8eef5" stroke-width="2.5"/><line x1="248.8" y1="103.9" x2="232.3" y2="111.6" stroke="#7d8a99" stroke-width="2.5"/><line x1="51.2" y1="103.9" x2="67.7" y2="111.6" stroke="#7d8a99" stroke-width="2.5"/><line x1="195.6" y1="51.0" x2="188.6" y2="66.3" stroke="#7d8a99" stroke-width="2.5"/><line x1="104.4" y1="51.0" x2="111.4" y2="66.3" stroke="#7d8a99" stroke-width="2.5"/><line x1="216.4" y1="63.5" x2="207.8" y2="74.6" stroke="#7d8a99" stroke-width="1.5"/><line x1="83.6" y1="63.5" x2="92.2" y2="74.6" stroke="#7d8a99" stroke-width="1.5"/><line x1="230.8" y1="76.8" x2="218.3" y2="88.1" stroke="#7d8a99" stroke-width="2.5"/><line x1="69.2" y1="76.8" x2="81.7" y2="88.1" stroke="#7d8a99" stroke-width="2.5"/><line x1="180.6" y1="45.4" x2="176.7" y2="58.8" stroke="#7d8a99" stroke-width="1.5"/><line x1="119.4" y1="45.4" x2="123.3" y2="58.8" stroke="#7d8a99" stroke-width="1.5"/><line x1="161.8" y1="41.6" x2="160.7" y2="51.4" stroke="#7d8a99" stroke-width="1.5"/><line x1="138.2" y1="41.6" x2="139.3" y2="51.4" stroke="#7d8a99" stroke-width="1.5"/><line x1="167.8" y1="42.5" x2="166.2" y2="52.1" stroke="#7d8a99" stroke-width="1.5"/><line x1="132.2" y1="42.5" x2="133.8" y2="52.1" stroke="#7d8a99" stroke-width="1.5"/><line x1="172.7" y1="43.4" x2="170.7" y2="53.0" stroke="#7d8a99" stroke-width="1.5"/><line x1="127.3" y1="43.4" x2="129.3" y2="53.0" stroke="#7d8a99" stroke-width="1.5"/><line x1="176.9" y1="44.4" x2="174.5" y2="53.9" stroke="#7d8a99" stroke-width="1.5"/><line x1="123.1" y1="44.4" x2="125.5" y2="53.9" stroke="#7d8a99" stroke-width="1.5"/><line x1="188.7" y1="48.1" x2="185.3" y2="57.3" stroke="#7d8a99" stroke-width="1.5"/><line x1="111.3" y1="48.1" x2="114.7" y2="57.3" stroke="#7d8a99" stroke-width="1.5"/><line x1="207.1" y1="57.1" x2="201.9" y2="65.5" stroke="#7d8a99" stroke-width="1.5"/><line x1="92.9" y1="57.1" x2="98.1" y2="65.5" stroke="#7d8a99" stroke-width="1.5"/><line x1="241.3" y1="90.4" x2="233.1" y2="95.8" stroke="#7d8a99" stroke-width="1.5"/><line x1="58.7" y1="90.4" x2="66.9" y2="95.8" stroke="#7d8a99" stroke-width="1.5"/><text x="182.7" y="82.2" fill="#7d8a99" font-size="9" text-anchor="middle">10</text><text x="117.3" y="82.2" fill="#7d8a99" font-size="9" text-anchor="middle">10</text><text x="207.8" y="100.6" fill="#7d8a99" font-size="9" text-anchor="middle">30</text><text x="92.2" y="100.6" fill="#7d8a99" font-size="9" text-anchor="middle">30</text><text x="32" y="40" fill="#ff8a8a" font-size="26" font-weight="700" text-anchor="middle">♭</text><text x="268" y="40" fill="#ff8a8a" font-size="26" font-weight="700" text-anchor="middle">♯</text><text x="32" y="62" fill="#7d8a99" font-size="11" text-anchor="middle">trop bas</text><text x="268" y="62" fill="#7d8a99" font-size="11" text-anchor="middle">trop haut</text><g id="needle" style="transform-origin:150px 150px"><line x1="150" y1="150" x2="150" y2="46" stroke="#7d8a99" stroke-width="4" stroke-linecap="round"/></g><circle cx="150" cy="150" r="9" fill="#e8eef5"/></svg></div>
  <div id="cents"></div>
  <div class="strings" id="strings"></div>
  <button id="play" disabled>🔊 Jouer la note</button>
  <button id="start">Démarrer</button>
  <div id="level" style="width:100%;max-width:340px;height:4px;background:var(--card);border-radius:2px;overflow:hidden"><div id="lvl" style="height:100%;width:0;background:var(--ok);transition:width .1s"></div></div>
  <div id="msg">Touchez « Démarrer » et autorisez le micro.</div>
</main>
<script src="pitch.js"></script>
<script>
const NAMES = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const TUNINGS = {
  guit: [['Mi',82.41,2],['La',110,2],['Ré',146.83,3],['Sol',196,3],['Si',246.94,3],['Mi',329.63,4]],
  alto: [['Do',130.81,3],['Sol',196,3],['Ré',293.66,4],['La',440,4]],
  violon: [['Sol',196,3],['Ré',293.66,4],['La',440,4],['Mi',659.26,5]]
};
const $ = id => document.getElementById(id);
let a4 = +localStorage.getItem('a4') || 440, mode = localStorage.getItem('mode') || 'alto', target = null, near = null;
if (!TUNINGS[mode] && mode !== 'chro') mode = 'alto';
let ctx, analyser, buf, smooth = null, lastHeard = 0, lastTarget = null, tone = null, lastDetect = 0;

function setA4(v){ a4 = Math.min(460, Math.max(415, v)); localStorage.setItem('a4', a4); $('a4').textContent = `A4 = ${a4} Hz`; }
setA4(a4);
$('m').onclick = () => setA4(a4-1); $('p').onclick = () => setA4(a4+1);

function renderStrings(){
  const box = $('strings'); box.innerHTML = '';
  if (TUNINGS[mode]) {
    const a = document.createElement('button'); a.textContent = 'Auto';
    a.className = 'auto' + (target === null ? ' on' : '');
    a.onclick = () => { target = null; renderStrings(); updatePlay(); };
    box.appendChild(a);
  }
  (TUNINGS[mode] || []).forEach((s,i) => {
    const b = document.createElement('button'); b.innerHTML = `${s[0]}<small style="color:var(--mut)">${s[2]}</small>`;
    b.onclick = () => { target = target === i ? null : i; renderStrings(); updatePlay(); };
    if (target === i) b.className = 'on'; else if (target === null && near === i) b.className = 'near';
    box.appendChild(b);
  });
}
document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; target = null; near = null; lastTarget = null; stopTone(); localStorage.setItem('mode', mode);
  document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
  renderStrings(); updatePlay();
});

function analyse(f){
  const scale = a4/440;
  if (mode !== 'chro' && target !== null) {
    const [n,hz] = TUNINGS[mode][target], t = hz*scale;
    return {label:n, oct:TUNINGS[mode][target][2], cents:1200*Math.log2(f/t), hz:t};
  }
  if (mode !== 'chro') { // corde la plus proche
    let best = 0, bd = 1e9;
    TUNINGS[mode].forEach(([n,hz],i) => { const d = Math.abs(Math.log2(f/(hz*scale))); if (d<bd){bd=d;best=i;} });
    const [n,hz] = TUNINGS[mode][best], t = hz*scale;
    if (near !== best) { near = best; renderStrings(); }
    return {label:n, oct:TUNINGS[mode][best][2], cents:1200*Math.log2(f/t), hz:t};
  }
  const midi = Math.round(69 + 12*Math.log2(f/a4));
  const t = a4*Math.pow(2,(midi-69)/12);
  return {label:NAMES[((midi%12)+12)%12], oct:Math.floor(midi/12)-1, cents:1200*Math.log2(f/t), hz:t};
}

const ang = c => Math.sign(c) * 65 * Math.pow(Math.min(Math.abs(c), 50) / 50, 0.6);
const colFor = a => a < 3 ? 'var(--ok)' : a < 10 ? 'var(--warn)' : 'var(--bad)';
let hist = [], histLabel = null, fc = 0, needleAng = 0, needleTgt = 0, active = false;

function show(r, f){
  lastTarget = r; updatePlay();
  const a = Math.abs(r.cents), col = colFor(a);
  $('note').innerHTML = r.label + (r.oct !== '' ? `<small>${r.oct}</small>` : '');
  $('note').style.color = col;
  needleTgt = ang(r.cents); active = true;
  $('needle').firstChild.style.stroke = col;
  $('freq').textContent = f.toFixed(2) + ' Hz  (cible ' + r.hz.toFixed(2) + ')';
  $('cents').textContent = a < 3 ? 'Juste ✓  ' + (r.cents > 0 ? '+' : '') + r.cents.toFixed(1) + ' ¢'
    : (r.cents > 0 ? '▼ Trop haut  +' : '▲ Trop bas  −') + a.toFixed(1) + ' ¢';
  $('cents').style.color = col;
}
function idle(){
  active = false; needleTgt = 0; hist = []; histLabel = null;
  $('note').textContent = '–'; $('note').style.color = 'var(--fg)';
  $('needle').firstChild.style.stroke = 'var(--mut)';
  $('freq').textContent = ''; $('cents').textContent = '';
}
// l'aiguille est animée à 60 i/s, indépendamment de la détection (~25 i/s)
function render(){
  needleAng += (needleTgt - needleAng) * 0.22;
  if (Math.abs(needleTgt - needleAng) < 0.02) needleAng = needleTgt;
  $('needle').style.transform = `rotate(${needleAng.toFixed(2)}deg)`;
  requestAnimationFrame(render);
}
render();
const median = a => { const b = [...a].sort((x,y)=>x-y); return b[b.length>>1]; };

// plage de recherche : serrée autour de la corde choisie, sinon autour de l'instrument
function searchRange(){
  const sc = a4 / 440, T = TUNINGS[mode];
  if (!T) return [60, 1200];
  if (target !== null) { const hz = T[target][1] * sc; return [hz * 0.8, hz * 1.25]; }
  const hzs = T.map(x => x[1] * sc);
  return [Math.min(...hzs) * 0.8, Math.max(...hzs) * 1.25];
}
let missed = 0;
function loop(){
  requestAnimationFrame(loop);
  if (tone) { lastHeard = performance.now(); return; }
  const now = performance.now();
  if (now - lastDetect < 50) return;
  lastDetect = now;
  if (ctx.state !== 'running') { ctx.resume().catch(() => {}); $('msg').textContent = 'Micro en pause… touchez l’écran.'; return; }
  analyser.getFloatTimeDomainData(buf);
  const [lo, hi] = searchRange();
  const res = detectPitchEx(buf, ctx.sampleRate, lo, hi);
  $('lvl').style.width = Math.min(100, Math.sqrt(res.rms || 0) * 220) + '%';
  if (res.freq > 0 && res.clarity > 0.7) {
    missed = 0; lastHeard = now;
    $('msg').textContent = 'Écoute en cours…';
    const r = analyse(res.freq);
    if (r.label + r.oct !== histLabel) { hist = []; histLabel = r.label + r.oct; fc = r.cents; needleAng = needleTgt = ang(r.cents); }
    hist.push(r.cents); if (hist.length > 7) hist.shift();
    fc += (median(hist) - fc) * 0.35;
    r.cents = fc;
    show(r, r.hz * Math.pow(2, fc / 1200));
  } else if (now - lastHeard > 900) { idle(); if (near !== null) { near = null; renderStrings(); } }
}

function curTarget(){
  if (mode !== 'chro' && target !== null) { const [n,hz,o] = TUNINGS[mode][target]; return {label:n, oct:o, hz:hz*a4/440}; }
  return lastTarget;
}
function updatePlay(){
  const t = curTarget(), b = $('play');
  b.disabled = !t && !tone;
  b.classList.toggle('on', !!tone);
  b.textContent = tone ? '■ Stop' : t ? `🔊 Jouer ${t.label}${t.oct}` : '🔊 Jouer la note';
}
function stopTone(){
  if (!tone) return;
  const {osc, gain, timer} = tone; tone = null; clearTimeout(timer);
  const t = ctx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setTargetAtTime(0, t, 0.05);
  osc.stop(t + 0.3); updatePlay();
}
$('play').onclick = async () => {
  if (tone) return stopTone();
  const t = curTarget(); if (!t) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.setPeriodicWave(ctx.createPeriodicWave(new Float32Array([0,0,0,0,0]), new Float32Array([0,1,.45,.2,.1])));
  osc.frequency.value = t.hz;
  gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.04);
  osc.connect(gain).connect(ctx.destination); osc.start();
  tone = {osc, gain, timer: setTimeout(stopTone, 6000)};
  updatePlay();
  if (!analyser) { $('note').innerHTML = t.label + `<small>${t.oct}</small>`; }
};
$('start').onclick = async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Micro indisponible (HTTPS requis).');
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 8192; analyser.smoothingTimeConstant = 0;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    ctx.onstatechange = () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) ctx.resume().catch(() => {}); });
    document.addEventListener('touchstart', () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); }, {passive:true});
    stream.getAudioTracks()[0].onended = () => { $('msg').textContent = 'Micro coupé. Rechargez la page.'; };
    $('start').style.display = 'none'; $('msg').textContent = 'Jouez une note…';
    navigator.wakeLock?.request('screen').catch(()=>{});
    loop();
  } catch (e) {
    $('msg').textContent = 'Erreur : ' + (e.message || e.name) + ' — vérifiez l’autorisation du micro dans Réglages > Safari.';
  }
};
renderStrings(); updatePlay();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
