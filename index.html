<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accordeur">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Accordeur</title>
<style>
:root{--bg:#0b0f14;--fg:#e8eef5;--mut:#7d8a99;--ok:#2ee59d;--warn:#ffb020;--bad:#ff5d5d;--card:#151b23}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none}
#v-accordeur header{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;padding:12px 0}
h1{font-size:18px;margin:0;font-weight:600}
.ref{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.ref button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:20px}
#v-accordeur main{flex:1;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#note{font-size:120px;font-weight:700;line-height:1;transition:color .15s}
#note small{font-size:40px;font-weight:500;vertical-align:top}
#freq{color:var(--mut);font-size:18px;font-variant-numeric:tabular-nums;min-height:24px}
.meter{width:100%;max-width:340px}
#needle line{transition:stroke .15s}
#cents{font-size:22px;font-variant-numeric:tabular-nums;min-height:28px}
.strings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.strings button{min-width:52px;padding:10px 0;border-radius:10px;border:0;background:var(--card);color:var(--fg);font-size:16px}
.strings button.auto{color:var(--mut)}
.strings button.auto.on{color:var(--fg)}
#play{padding:12px 26px;font-size:17px;border:0;border-radius:12px;background:var(--card);color:var(--fg)}
#play:disabled{opacity:.4}
#play.on{background:var(--warn);color:#201400}
.strings button.near{background:#233042}
.strings button.on{outline:2px solid var(--ok)}
#start{padding:16px 40px;font-size:20px;border:0;border-radius:14px;background:var(--ok);color:#04130c;font-weight:700}
#msg{color:var(--mut);text-align:center;font-size:14px;min-height:20px}
.modes{display:flex;gap:8px}
.modes button{padding:8px 14px;border-radius:20px;border:0;background:var(--card);color:var(--mut)}
.modes button.on{background:var(--fg);color:var(--bg)}

nav{position:sticky;top:0;z-index:10;width:calc(100% + 32px);margin:0 -16px;padding:8px 16px;display:flex;justify-content:center;gap:10px;background:rgba(11,15,20,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #1d2630}
nav button{width:56px;height:46px;border:0;border-radius:14px;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ver{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
nav{position:sticky}
nav{min-height:62px}
nav button.on{background:var(--card);color:var(--ok)}
.view{display:none;flex:1;width:100%;max-width:460px;flex-direction:column;align-items:center}
.view.on{display:flex}
/* accueil : îles */
.isles{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:20px 0}
.isle{position:relative;width:78%;max-width:300px;aspect-ratio:1.25;border:0;color:#fff;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;box-shadow:0 22px 30px -12px rgba(0,0,0,.7),inset 0 -10px 0 rgba(0,0,0,.18);animation:float 5s ease-in-out infinite}
.isle svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.isle small{font-size:13px;font-weight:500;opacity:.8}
.isle.t{background:linear-gradient(145deg,#2ee59d,#0f8a78)}
.isle.m{background:linear-gradient(145deg,#6aa8ff,#4a4fd0);border-radius:44% 56% 42% 58% / 56% 44% 58% 42%;animation-delay:-2.5s}
.isle:active{transform:scale(.97)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.soon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);text-align:center}
.soon svg{width:72px;height:72px;fill:none;stroke:var(--mut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.soon h2{margin:0;color:var(--fg)}

#v-metronome{align-items:center;gap:14px;padding-bottom:16px;position:relative}
#bpm{font-size:104px;font-weight:700;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
#tname{color:var(--mut);font-size:18px;letter-spacing:.04em;text-transform:capitalize;min-height:24px}
.bpmrow{display:flex;align-items:center;gap:12px;width:100%}
.bpmrow button{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:28px}
.bpmrow input{flex:1;accent-color:var(--ok);height:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips button,.opts button{padding:9px 14px;border-radius:20px;border:0;background:var(--card);color:var(--mut);font-size:15px}
.chips button.on,.opts button.on{background:var(--fg);color:var(--bg)}
.lbl{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;align-self:flex-start;margin-top:4px}
.dots{display:flex;gap:12px;justify-content:center;align-items:center;min-height:40px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;background:#222c38;transition:background .05s,transform .05s}
.dot.acc{width:30px;height:30px;border:2px solid #3a4858}
.dot.lit{background:var(--ok);transform:scale(1.15)}
.dot.acc.lit{background:var(--warn)}
.opts{display:flex;gap:8px;justify-content:center}
#mgo{width:100%;padding:18px;font-size:22px;font-weight:700;border:0;border-radius:16px;background:var(--ok);color:#04130c;margin-top:auto}
#mgo.on{background:var(--bad);color:#fff}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .25s ease-out}
#flash.f{opacity:.22;transition:none}

.view{transform:translateY(var(--pull,0px))}
.view.snap{transition:transform .25s ease-out}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--card);color:var(--ok);
  display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(-50px);z-index:4;box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none}
#ptr.snap{transition:transform .25s ease-out,opacity .25s}
#ptr svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav .cfg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:44px}
nav.home button:not(.cfg){display:none}
#ver{cursor:pointer;padding:8px}
#v-reglages{align-items:stretch;gap:10px;padding-bottom:30px}
#v-reglages h2{font-size:22px;margin:14px 0 0}
#v-reglages .chips{justify-content:flex-start}
#v-reglages p{color:var(--mut);font-size:14px;line-height:1.45;margin:4px 0}
.rel{background:var(--card);border-radius:12px;padding:10px 14px;margin:6px 0}
.rel summary{font-weight:600;cursor:pointer}
.rel summary small{color:var(--mut);font-weight:400;margin-left:8px}
.rel ul{margin:8px 0 2px;padding-left:20px;font-size:14px;color:var(--fg)}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%}
#modal h3{margin:0 0 8px;font-size:20px}
#modal ul{padding-left:20px;margin:8px 0 16px;font-size:15px;line-height:1.4}
#modal button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--ok);color:#04130c;font-size:17px;font-weight:700}

.isles{gap:22px}
.isle{width:min(70%,260px);aspect-ratio:1.55;font-size:20px}
.isle svg{width:44px;height:44px}
.isle.s{background:linear-gradient(145deg,#ffb86b,#e0558a);border-radius:52% 48% 40% 60% / 45% 55% 45% 55%;animation-delay:-1.2s}
nav button{width:50px}
#v-partition{align-items:stretch;gap:10px;padding-bottom:20px}
#v-partition .btn,#v-partition .opts button{padding:10px 16px;border-radius:20px;border:0;background:var(--card);color:var(--fg);font-size:15px}
#v-partition .btn.main{background:var(--ok);color:#04130c;font-weight:700}
.hint{color:var(--mut);font-size:13px;line-height:1.4}
#sc-wrap{overflow:auto;background:#10161d;border-radius:12px;max-height:46vh;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
#sc-canvas{display:block;height:auto}
#sc-busy{display:none;text-align:center;color:var(--ok);padding:20px}
#sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet.on{transform:none;visibility:visible}
#sheet h3{margin:0 0 8px;font-size:18px}
#sheet .chips{justify-content:flex-start;margin:6px 0}
#sheet button{padding:9px 14px;border-radius:18px;border:0;background:#222c38;color:var(--fg);font-size:15px}
#sheet button.on{background:var(--fg);color:var(--bg)}
#sheet button.del{background:var(--bad);color:#fff}
#v-partition .chips{justify-content:flex-start}
#sc-play{width:100%}
.isle.s small{opacity:.85}
</style>
</head>
<body>
<nav>
  <button data-go="accueil" data-i18n-aria="nav.home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
  <button data-go="accordeur" data-i18n-aria="nav.tuner"><svg viewBox="0 0 24 24"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17 16.5 9"/><circle cx="12" cy="17" r="1.2"/><path d="M12 8.5V7M6.8 10.3l-.9-.9M17.2 10.3l.9-.9"/></svg></button>
  <button data-go="metronome" data-i18n-aria="nav.metro"><svg viewBox="0 0 24 24"><path d="M8.5 3h7l3.5 17.5H5z"/><path d="M12 16.5 15.5 7"/><path d="M13.3 10.5h3.2"/></svg></button>
  <button data-go="partition" data-i18n-aria="nav.score"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 11h16M4 14h16M4 17h16M4 20h16" transform="translate(0 -3)"/><ellipse cx="9" cy="14.2" rx="2" ry="1.4" fill="currentColor" stroke="none"/><path d="M11 14V6.5"/></svg></button>
  <button class="cfg" data-go="reglages" data-i18n-aria="nav.settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
  <span id="ver"></span>
</nav>

<section class="view" id="v-accueil">
  <div class="isles">
    <button class="isle t" data-go="accordeur"><svg viewBox="0 0 24 24"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17 16.5 9"/><circle cx="12" cy="17" r="1.2"/><path d="M12 8.5V7M6.8 10.3l-.9-.9M17.2 10.3l.9-.9"/></svg><span data-i18n="nav.tuner"></span><small data-i18n="tile.tuner.sub"></small></button>
    <button class="isle m" data-go="metronome"><svg viewBox="0 0 24 24"><path d="M8.5 3h7l3.5 17.5H5z"/><path d="M12 16.5 15.5 7"/><path d="M13.3 10.5h3.2"/></svg><span data-i18n="nav.metro"></span><small data-i18n="tile.metro.sub"></small></button>
    <button class="isle s" data-go="partition"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 11h16M4 14h16M4 17h16M4 20h16" transform="translate(0 -3)"/><ellipse cx="9" cy="14.2" rx="2" ry="1.4" fill="currentColor" stroke="none"/><path d="M11 14V6.5"/></svg><span data-i18n="nav.score"></span><small data-i18n="tile.score.sub"></small></button>
  </div>
</section>

<section class="view" id="v-metronome">
  <div id="bpm">100</div>
  <div id="tname"></div>
  <div class="bpmrow"><button id="bm" aria-label="Moins">−</button><input id="bslide" type="range" min="30" max="250" step="1"><button id="bp" aria-label="Plus">+</button></div>
  <div class="opts"><button id="tap" data-i18n="metro.tap"></button></div>
  <div class="lbl" data-i18n="metro.sig"></div>
  <div class="chips" id="tsig"></div>
  <div class="lbl" data-i18n="metro.sub"></div>
  <div class="chips" id="subs"></div>
  <div class="dots" id="dots"></div>
  <div class="bpmrow" style="gap:10px"><span>🔈</span><input id="vol" type="range" min="0" max="100" step="1" data-i18n-aria="metro.vol"><span>🔊</span></div>
  <div class="opts"><button id="oflash">Flash écran</button><button id="osound">Son</button></div>
  <button id="mgo"></button>
</section>
<section class="view" id="v-reglages">
  <h2 data-i18n="set.title"></h2>
  <div class="lbl" data-i18n="set.lang"></div>
  <div class="chips" id="p-lang"></div>
  <div class="lbl" data-i18n="set.instr"></div>
  <div class="chips" id="p-instr"></div>
  <p data-i18n="storage"></p>
  <h2 data-i18n="set.help"></h2>
  <p data-i18n="help.1"></p><p data-i18n="help.2"></p><p data-i18n="help.3"></p><p data-i18n="help.4"></p>
  <h2 data-i18n="set.about"></h2>
  <p><span data-i18n="set.version"></span> <b id="p-ver"></b></p>
  <div class="lbl" data-i18n="set.notes"></div>
  <div id="p-notes"></div>
</section>
<section class="view" id="v-partition">
  <div class="opts"><label class="btn main" id="sc-pick"><span data-i18n="score.photo"></span><input id="sc-file" type="file" accept="image/*" hidden></label><button id="sc-del" data-i18n="score.del"></button></div>
  <div class="hint" id="sc-info"></div>
  <div id="sc-busy"></div>
  <div id="sc-wrap"><canvas id="sc-canvas"></canvas></div>
  <div id="sc-tools" style="display:none">
    <div class="lbl" data-i18n="score.clef"></div><div class="chips" id="sc-clef"></div>
    <div class="lbl" data-i18n="score.key"></div><div class="chips" id="sc-key"></div>
    <div class="lbl"><span data-i18n="score.tempo"></span> <b id="sc-bpm"></b></div>
    <div class="bpmrow"><input id="sc-tempo" type="range" min="40" max="200" step="1"></div>
    <div class="lbl"><span data-i18n="score.zoom"></span></div>
    <div class="bpmrow"><input id="sc-zoom" type="range" min="100" max="500" step="10"></div>
    <button id="sc-play" class="btn main" style="padding:14px;font-size:18px;border-radius:14px;border:0;background:var(--ok);color:#04130c;font-weight:700"></button>
    <p class="hint" data-i18n="score.nosound"></p><p class="hint" data-i18n="score.limits"></p>
  </div>
</section>
<div id="sheet"></div>
<div id="modal"><div class="box"><h3 id="m-title"></h3><ul id="m-list"></ul><button id="m-ok"></button></div></div>
<div id="flash"></div>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M20.23 10.33 L22.91 10.57 L22.91 13.43 L20.23 13.67 L19.00 16.64 L20.72 18.70 L18.70 20.72 L16.64 19.00 L13.67 20.23 L13.43 22.91 L10.57 22.91 L10.33 20.23 L7.36 19.00 L5.30 20.72 L3.28 18.70 L5.00 16.64 L3.77 13.67 L1.09 13.43 L1.09 10.57 L3.77 10.33 L5.00 7.36 L3.28 5.30 L5.30 3.28 L7.36 5.00 L10.33 3.77 L10.57 1.09 L13.43 1.09 L13.67 3.77 L16.64 5.00 L18.70 3.28 L20.72 5.30 L19.00 7.36Z"/><circle cx="12" cy="12" r="3.4"/></svg></div>

<section class="view" id="v-accordeur">
<header>
  <h1 data-i18n="nav.tuner"></h1>
  <div class="ref"><button id="m">−</button><span id="a4">A4 = 440 Hz</span><button id="p">+</button></div>
</header>
<main>
  <div class="modes"><button data-mode="alto" data-i18n="mode.alto"></button><button data-mode="violon" data-i18n="mode.violon"></button><button data-mode="chro" data-i18n="mode.chro"></button><button data-mode="guit" data-i18n="mode.guit"></button></div>
  <div id="note">–</div>

 x1="176.9" y1="44.4" x2="174.5" y2="53.9" stroke="#7d8a99" stroke-width="1.5"/><line x1="123.1" y1="44.4" x2="125.5" y2="53.9" stroke="#7d8a99" stroke-width="1.5"/><line x1="188.7" y1="48.1" x2="185.3" y2="57.3" stroke="#7d8a99" stroke-width="1.5"/><line x1="111.3" y1="48.1" x2="114.7" y2="57.3" stroke="#7d8a99" stroke-width="1.5"/><line x1="207.1" y1="57.1" x2="201.9" y2="65.5" stroke="#7d8a99" stroke-width="1.5"/><line x1="92.9" y1="57.1" x2="98.1" y2="65.5" stroke="#7d8a99" stroke-width="1.5"/><line x1="241.3" y1="90.4" x2="233.1" y2="95.8" stroke="#7d8a99" stroke-width="1.5"/><line x1="58.7" y1="90.4" x2="66.9" y2="95.8" stroke="#7d8a99" stroke-width="1.5"/><text x="182.7" y="82.2" fill="#7d8a99" font-size="9" text-anchor="middle">10</text><text x="117.3" y="82.2" fill="#7d8a99" font-size="9" text-anchor="middle">10</text><text x="207.8" y="100.6" fill="#7d8a99" font-size="9" text-anchor="middle">30</text><text x="92.2" y="100.6" fill="#7d8a99" font-size="9" text-anchor="middle">30</text><text x="32" y="40" fill="#ff8a8a" font-size="26" font-weight="700" text-anchor="middle">♭</text><text x="268" y="40" fill="#ff8a8a" font-size="26" font-weight="700" text-anchor="middle">♯</text><text x="32" y="62" fill="#7d8a99" font-size="11" text-anchor="middle" data-i18n="gauge.low"></text><text x="268" y="62" fill="#7d8a99" font-size="11" text-anchor="middle" data-i18n="gauge.high"></text><g id="needle" style="transform-origin:150px 150px"><line x1="150" y1="150" x2="150" y2="46" stroke="#7d8a99" stroke-width="4" stroke-linecap="round"/></g><circle cx="150" cy="150" r="9" fill="#e8eef5"/></svg></div>

<script>
// --- préférences (gardées sur l'appareil) et langue
const PREFS = Object.assign({lang:'fr', instrument:'alto'}, (() => { try { return JSON.parse(localStorage.getItem('prefs')) || {}; } catch (e) { return {}; } })());
const savePrefs = () => { try { localStorage.setItem('prefs', JSON.stringify(PREFS)); } catch (e) {} };
if (!I18N[PREFS.lang]) PREFS.lang = 'fr';
LANG = PREFS.lang; document.documentElement.lang = LANG;
let curMsg = ['msg.idle'];
// iOS : « playback » = son fort, haut-parleur, même en mode silencieux ; « play-and-record » seulement quand le micro écoute.
function audioMode(m){ try { if (navigator.audioSession) navigator.audioSession.type = m; } catch (e) {} }
function unlockAudio(){          // petit silence joué dans le geste de l'utilisateur : réveille l'audio iOS
  try { const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); } catch (e) {}
}
function setMsg(k, a){ curMsg = [k, a]; $('msg').textContent = tr(k, a); }
const NAMES = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const TUNINGS = {
  guit: [['Mi',82.41,2],['La',110,2],['Ré',146.83,3],['Sol',196,3],['Si',246.94,3],['Mi',329.63,4]],
  alto: [['Do',130.81,3],['Sol',196,3],['Ré',293.66,4],['La',440,4]],
  violon: [['Sol',196,3],['Ré',293.66,4],['La',440,4],['Mi',659.26,5]]
};
const $ = id => document.getElementById(id);
let a4 = +localStorage.getItem('a4') || 440, mode = PREFS.instrument, target = null, near = null;
if (!TUNINGS[mode] && mode !== 'chro') mode = 'alto';
let wired = false, stream = null, loopOn = false, ctx, analyser, buf, smooth = null, lastHeard = 0, lastTarget = null, tone = null, lastDetect = 0;

function setA4(v){ a4 = Math.min(460, Math.max(415, v)); localStorage.setItem('a4', a4); $('a4').textContent = `A4 = ${a4} Hz`; }
setA4(a4);
$('m').onclick = () => setA4(a4-1); $('p').onclick = () => setA4(a4+1);

function renderStrings(){
  const box = $('strings'); box.innerHTML = '';
  if (TUNINGS[mode]) {
    const a = document.createElement('button'); a.textContent = tr('auto');
    a.className = 'auto' + (target === null ? ' on' : '');
    a.onclick = () => { target = null; renderStrings(); updatePlay(); };
    box.appendChild(a);
  }
  (TUNINGS[mode] || []).forEach((s,i) => {
    const b = document.createElement('button'); b.innerHTML = `${nn(s[0])}<small style="color:var(--mut)">${s[2]}</small>`;
    b.onclick = () => { target = target === i ? null : i; renderStrings(); updatePlay(); };
    if (target === i) b.className = 'on'; else if (target === null && near === i) b.className = 'near';
    box.appendChild(b);
  });
}
document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
function setMode(m){
  mode = m; target = null; near = null; lastTarget = null; stopTone();
  document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x.dataset.mode === mode));
  renderStrings(); updatePlay();
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

function analyse(f, idx){
  const scale = a4/440;
  if (mode !== 'chro' && target !== null) {
    const [n,hz] = TUNINGS[mode][target], t = hz*scale;
    return {label:n, oct:TUNINGS[mode][target][2], cents:1200*Math.log2(f/t), hz:t};
  }
  if (mode !== 'chro') { // corde la plus proche
    let best = idx ?? 0, bd = 1e9;
    if (idx === undefined) TUNINGS[mode].forEach(([n,hz],i) => { const d = Math.abs(Math.log2(f/(hz*scale))); if (d<bd){bd=d;best=i;} });
    const [n,hz] = TUNINGS[mode][best], t = hz*scale;
    if (near !== best) { near = best; renderStrings(); }
    return {label:n, oct:TUNINGS[mode][best][2], cents:1200*Math.log2(f/t), hz:t};
  }
  const midi = Math.round(69 + 12*Math.log2(f/a4));
  const t = a4*Math.pow(2,(midi-69)/12);
  return {label:NAMES[((midi%12)+12)%12], oct:Math.floor(midi/12)-1, cents:1200*Math.log2(f/t), hz:t};
}

const ang = c => Math.sign(c) * 65 * Math.pow(Math.min(Math.abs(c), 50) / 50, 0.6);
const colFor = a => a < 3 ? 'var(--ok)' : a < 10 ? 'var(--warn)' : 'var(--bad)';
let hist = [], histLabel = null, fc = 0, needleAng = 0, needleTgt = 0, active = false;

function show(r, f){
  lastTarget = r; updatePlay();
  const a = Math.abs(r.cents), col = colFor(a);
  $('note').innerHTML = nn(r.label) + (r.oct !== '' ? `<small>${r.oct}</small>` : '');
  $('note').style.color = col;
  needleTgt = ang(r.cents); active = true;
  $('needle').firstChild.style.stroke = col;
  $('freq').textContent = f.toFixed(2) + ' Hz  (' + tr('target') + ' ' + r.hz.toFixed(2) + ')';
  $('cents').textContent = a < 3 ? tr('cents.ok') + '  ' + (r.cents > 0 ? '+' : '') + r.cents.toFixed(1) + ' ¢'
    : (r.cents > 0 ? tr('cents.high') + '  +' : tr('cents.low') + '  −') + a.toFixed(1) + ' ¢';
  $('cents').style.color = col;
}
function idle(){
  active = false; needleTgt = 0; hist = []; histLabel = null;
  $('note').textContent = '–'; $('note').style.color = 'var(--fg)';
  $('needle').firstChild.style.stroke = 'var(--mut)';
  $('freq').textContent = ''; $('cents').textContent = '';
}
// l'aiguille est animée à 60 i/s, indépendamment de la détection (~25 i/s)
function render(){
  needleAng += (needleTgt - needleAng) * 0.22;
  if (Math.abs(needleTgt - needleAng) < 0.02) needleAng = needleTgt;
  $('needle').style.transform = `rotate(${needleAng.toFixed(2)}deg)`;
  requestAnimationFrame(render);
}
render();
const median = a => { const b = [...a].sort((x,y)=>x-y); return b[b.length>>1]; };

// Instruments : détection ciblée autour des cordes (pas d'erreur d'octave). Chromatique : YIN.
let pend = 0, pendKey = null;
function detect(){
  const T = TUNINGS[mode], sc = a4 / 440;
  if (!T) { const x = detectPitchEx(buf, ctx.sampleRate, 60, 1200); return x.freq > 0 && x.clarity > 0.7 ? {...x, idx: undefined} : {rms: x.rms, freq: -1}; }
  const ids = target !== null ? [target] : T.map((_, k) => k);
  const wins = ids.map(k => ({hz: T[k][1] * sc, tol: target !== null ? 0.15 : 0.10}));
  const x = detectNearest(buf, ctx.sampleRate, wins);
  return x.index < 0 ? {rms: x.rms, freq: -1} : {...x, idx: ids[x.index]};
}
function loop(){
  if (!analyser) { loopOn = false; return; }
  requestAnimationFrame(loop);
  if (tone) { lastHeard = performance.now(); return; }
  const now = performance.now();
  if (now - lastDetect < 50) return;
  lastDetect = now;
  if (ctx.state !== 'running') { ctx.resume().catch(() => {}); setMsg('msg.paused'); return; }
  analyser.getFloatTimeDomainData(buf);
  const res = detect();
  $('lvl').style.width = Math.min(100, Math.sqrt(res.rms || 0) * 220) + '%';
  if (res.freq > 0) {
    lastHeard = now;
    setMsg('msg.listening');
    const r = analyse(res.freq, res.idx);
    if (res.idx !== undefined && target === null && near !== res.idx) { near = res.idx; renderStrings(); }
    const key = r.label + r.oct;
    if (key !== histLabel && histLabel !== null && active) {   // nouvelle note : confirmée sur 3 mesures consécutives
      pend = pendKey === key ? pend + 1 : 1; pendKey = key;
      if (pend < 3) return;
    }
    pend = 0; pendKey = null;
    if (r.label + r.oct !== histLabel) { hist = []; histLabel = r.label + r.oct; fc = r.cents; needleAng = needleTgt = ang(r.cents); }
    hist.push(r.cents); if (hist.length > 7) hist.shift();
    fc += (median(hist) - fc) * 0.35;
    r.cents = fc;
    show(r, r.hz * Math.pow(2, fc / 1200));
  } else if (now - lastHeard > 900) { idle(); if (near !== null) { near = null; renderStrings(); } }
}

function curTarget(){
  if (mode !== 'chro' && target !== null) { const [n,hz,o] = TUNINGS[mode][target]; return {label:n, oct:o, hz:hz*a4/440}; }
  return lastTarget;
}
function updatePlay(){
  const t = curTarget(), b = $('play');
  b.disabled = !t && !tone;
  b.classList.toggle('on', !!tone);
  b.textContent = tone ? tr('stopTone') : t ? tr('play.x', nn(t.label) + t.oct) : tr('play.note');
}
function stopTone(){
  if (!tone) return;
  const {osc, gain, timer} = tone; tone = null; clearTimeout(timer);
  const t = ctx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setTargetAtTime(0, t, 0.05);
  osc.stop(t + 0.3); updatePlay();
}
$('play').onclick = async () => {
  if (tone) return stopTone();
  const t = curTarget(); if (!t) return;
  audioMode('playback');
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume(); unlockAudio();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.setPeriodicWave(ctx.createPeriodicWave(new Float32Array([0,0,0,0,0]), new Float32Array([0,1,.45,.2,.1])));
  osc.frequency.value = t.hz;
  gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.04);
  osc.connect(gain).connect(ctx.destination); osc.start();
  tone = {osc, gain, timer: setTimeout(stopTone, 6000)};
  updatePlay();
  if (!analyser) { $('note').innerHTML = t.label + `<small>${t.oct}</small>`; }
};
$('start').onclick = async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error(tr('msg.nomic'));
    const reuse = stream && stream.getAudioTracks().some(t => t.readyState === 'live');
    if (reuse) stream.getTracks().forEach(t => { t.enabled = true; });
    else { audioMode('play-and-record'); stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 8192; analyser.smoothingTimeConstant = 0;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    if (!wired) { wired = true;
      ctx.onstatechange = () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); };
      document.addEventListener('visibilitychange', () => { if (!document.hidden) ctx.resume().catch(() => {}); });
      document.addEventListener('touchstart', () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); }, {passive:true});
      stream.getAudioTracks()[0].onended = () => { setMsg('msg.cut'); };
    }
    $('start').style.display = 'none'; setMsg('msg.play');
    navigator.wakeLock?.request('screen').catch(()=>{});
    if (!loopOn) { loopOn = true; loop(); }
  } catch (e) {
    setMsg('msg.err', e.message || e.name);
  }
};
renderStrings(); updatePlay();


// ================= MÉTRONOME =================
const SIGS = {'2/4':{n:2,acc:[0]},'3/4':{n:3,acc:[0]},'4/4':{n:4,acc:[0]},'6/8':{n:6,acc:[0,3]},'Libre':{n:4,acc:[]}};
const SUBS = [['Noires',1],['Croches',2],['Triolets',3],['Doubles',4]];
const M = Object.assign({bpm:100, sig:'4/4', sub:1, flash:false, sound:true, vol:80},
  (() => { try { return JSON.parse(localStorage.getItem('metro')) || {}; } catch (e) { return {}; } })());
if (!SIGS[M.sig]) M.sig = '4/4';
let mRun = false, mNext = 0, mBeat = 0, mSub = 0, mTimer = null, mQueue = [], mRaf = 0, mWake = null;
const saveM = () => { try { localStorage.setItem('metro', JSON.stringify(M)); } catch (e) {} };

function tempoName(b){
  return b<40?'grave':b<60?'largo':b<66?'larghetto':b<76?'adagio':b<108?'andante':b<120?'moderato':b<156?'allegro':b<176?'vivace':b<200?'presto':'prestissimo';
}
function setBpm(v){
  M.bpm = Math.max(30, Math.min(250, Math.round(v)));
  $('bpm').textContent = M.bpm; $('bslide').value = M.bpm; $('tname').textContent = tempoName(M.bpm); saveM();
}
function renderChips(){
  const mk = (box, items, cur, fn) => { box.innerHTML=''; items.forEach(([label, val]) => {
    const b = document.createElement('button'); b.textContent = label; if (val === cur) b.className = 'on';
    b.onclick = () => { fn(val); renderChips(); }; box.appendChild(b); }); };
  mk($('tsig'), Object.keys(SIGS).map(k => [k === 'Libre' ? tr('metro.free') : k, k]), M.sig, v => { M.sig = v; mBeat = 0; mSub = 0; saveM(); });
  mk($('subs'), SUBS.map(([, v]) => [tr('sub.' + v), v]), M.sub, v => { M.sub = v; mSub = 0; saveM(); });
  const d = $('dots'); d.innerHTML = '';
  for (let i = 0; i < SIGS[M.sig].n; i++) { const e = document.createElement('div'); e.className = 'dot' + (SIGS[M.sig].acc.includes(i) ? ' acc' : ''); d.appendChild(e); }
  $('oflash').classList.toggle('on', M.flash); $('osound').classList.toggle('on', M.sound);
  $('osound').textContent = M.sound ? tr('metro.sound') : tr('metro.mute'); $('oflash').textContent = tr('metro.flash');
  $('mgo').textContent = mRun ? tr('stop') : tr('start');
}
function click(time, kind){            // kind: 2 accent fort, 1 temps, 0 subdivision
  if (!M.sound) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  const [hz, vol] = kind === 2 ? [1500, 1] : kind === 3 ? [1250, .85] : kind === 1 ? [1000, .7] : [800, .3];
  o.frequency.value = hz; o.type = 'square';
  g.gain.setValueAtTime(0, time); g.gain.linearRampToValueAtTime(Math.max(.0002, vol * .5 * Math.pow(M.vol / 100, 2)), time + .002); g.gain.exponentialRampToValueAtTime(.0001, time + .045);
  o.connect(g).connect(ctx.destination); o.start(time); o.stop(time + .06);
}
function mSchedule(){
  const sig = SIGS[M.sig];
  while (mNext < ctx.currentTime + 0.12) {
    const main = mSub === 0, kind = !main ? 0 : (mBeat === 0 && sig.acc.length) ? 2 : sig.acc.includes(mBeat) ? 3 : 1;
    click(mNext, kind);
    mQueue.push({t: mNext, beat: mBeat, main, kind});
    mNext += 60 / M.bpm / M.sub;
    if (++mSub >= M.sub) { mSub = 0; mBeat = (mBeat + 1) % sig.n; }
  }
}
function mDraw(){
  const dots = $('dots').children;
  while (mQueue.length && mQueue[0].t <= ctx.currentTime) {
    const e = mQueue.shift();
    if (e.main) {
      [...dots].forEach(d => d.classList.remove('lit')); dots[e.beat]?.classList.add('lit');
      if (M.flash && ctx.currentTime - e.t < .1) { const f = $('flash'); f.classList.add('f'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('f'))); }
    }
  }
  if (mRun) mRaf = requestAnimationFrame(mDraw);
}
async function startMetro(){
  audioMode('playback');
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume(); unlockAudio();
  mRun = true; mBeat = 0; mSub = 0; mQueue = []; mNext = ctx.currentTime + 0.08;
  mTimer = setInterval(mSchedule, 25); mSchedule(); mDraw();
  $('mgo').textContent = tr('stop'); $('mgo').classList.add('on');
  navigator.wakeLock?.request('screen').then(w => { mWake = w; }).catch(() => {});
}
function stopMetro(){
  if (!mRun) return;
  mRun = false; clearInterval(mTimer); cancelAnimationFrame(mRaf); mQueue = [];
  [...$('dots').children].forEach(d => d.classList.remove('lit'));
  $('mgo').textContent = tr('start'); $('mgo').classList.remove('on');
  try { mWake && mWake.release(); } catch (e) {} mWake = null;
}
$('mgo').onclick = () => mRun ? stopMetro() : startMetro();
$('oflash').onclick = () => { M.flash = !M.flash; saveM(); renderChips(); };
$('osound').onclick = () => { M.sound = !M.sound; saveM(); renderChips(); };
$('vol').value = M.vol;
$('vol').oninput = e => { M.vol = +e.target.value; saveM(); };
$('bslide').oninput = e => setBpm(+e.target.value);
function holdBtn(id, delta){           // appui long = répétition
  const b = $(id); let t, i;
  const stop = () => { clearTimeout(t); clearInterval(i); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); setBpm(M.bpm + delta); t = setTimeout(() => { i = setInterval(() => setBpm(M.bpm + delta), 70); }, 400); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, stop));
}
holdBtn('bm', -1); holdBtn('bp', 1);
let taps = [];
$('tap').onclick = () => {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now); taps = taps.slice(-6);
  if (taps.length > 1) setBpm(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
};
setBpm(M.bpm); renderChips();

// --- tirer vers le bas pour rafraîchir
(function(){
  const ptr = $('ptr'), gear = ptr.firstElementChild, TH = 60, MAX = 120;
  let y0 = null, pull = 0, busy = false;
  const views = () => document.querySelectorAll('.view');
  const apply = (p, snap) => {
    views().forEach(v => { v.classList.toggle('snap', !!snap); v.style.setProperty('--pull', p + 'px'); });
    ptr.classList.toggle('snap', !!snap);
    ptr.style.opacity = Math.min(1, p / 40);
    ptr.style.transform = `translateY(${p - 50}px)`;
  };
  document.addEventListener('touchstart', e => {
    const t = e.target;
    if (busy || e.touches.length !== 1 || (window.scrollY || 0) > 0 || t.closest('input[type=range], nav')) { y0 = null; return; }
    y0 = e.touches[0].clientY; pull = 0;
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0) { if (pull) { pull = 0; apply(0); gear.style.transform = ''; } return; }
    if (e.cancelable) e.preventDefault();
    pull = Math.min(MAX, dy * 0.5);                       // résistance
    apply(pull);
    gear.style.transform = `rotate(${pull * 4}deg)`;
  }, {passive: false});
  const end = async () => {
    if (y0 === null) return; y0 = null;
    if (pull < TH) { apply(0, true); gear.style.transform = ''; pull = 0; return; }
    busy = true; apply(56, true); gear.style.transform = ''; ptr.classList.add('spin');
    const t0 = performance.now();
    try {
      const reg = await navigator.serviceWorker?.getRegistration();
      await Promise.race([reg ? reg.update() : 0, new Promise(r => setTimeout(r, 2500))]);
    } catch (e) {}
    const wait = 900 - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    location.reload();
  };
  document.addEventListener('touchend', end, {passive: true});
  document.addEventListener('touchcancel', end, {passive: true});
})();

// --- navigation (#accueil, #accordeur, #metronome)
function stopMic(){
  stopTone();
  // on garde le flux (désactivé) pour ne pas redemander l'autorisation à chaque retour sur l'accordeur
  if (stream) stream.getTracks().forEach(t => { t.enabled = false; });
  if (stream && !navigator.audioSession) { stream.getTracks().forEach(t => t.stop()); stream = null; }   // iOS ancien : sinon le son reste en mode « appel »
  audioMode('playback'); analyser = null; idle();
  $('start').style.display = ''; setMsg('msg.idle'); $('lvl').style.width = '0';
}
function route(){
  const page = ['accueil','accordeur','metronome','partition','reglages'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'accueil';
  if (page !== 'accordeur' && analyser) stopMic();
  if (page !== 'metronome') stopMetro();
  if (window.scoreRoute) window.scoreRoute(page);
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + page));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === page));
  document.querySelector('nav').classList.toggle('home', page === 'accueil');
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
window.addEventListener('hashchange', route);
route();
$('ver').textContent = 'v' + APP_VERSION; $('ver').onclick = () => { location.hash = 'reglages'; };

// --- langue, réglages, notes de version
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = tr(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', tr(e.dataset.i18nAria)));
  renderStrings(); updatePlay(); renderChips(); setMsg(...curMsg); renderSettings(); if (window.scoreRefresh) window.scoreRefresh();
}
function renderSettings(){
  const mk = (box, items, cur, fn) => { box.innerHTML = ''; items.forEach(([label, val]) => {
    const b = document.createElement('button'); b.textContent = label; if (val === cur) b.className = 'on';
    b.onclick = () => { fn(val); renderSettings(); }; box.appendChild(b); }); };
  mk($('p-lang'), [['Français','fr'],['English','en']], LANG, v => { PREFS.lang = LANG = v; savePrefs(); applyLang(); });
  mk($('p-instr'), ['alto','violon','guit','chro'].map(k => [tr('mode.' + k), k]), PREFS.instrument, v => { PREFS.instrument = v; savePrefs(); setMode(v); });
  $('p-ver').textContent = APP_VERSION;
  const box = $('p-notes'); box.innerHTML = '';
  if (!RELEASES) { box.textContent = tr('notes.none'); return; }
  RELEASES.forEach((rel, i) => {
    const d = document.createElement('details'); d.className = 'rel'; d.open = i === 0;
    d.innerHTML = `<summary>v${rel.version}<small>${rel.date}</small></summary><ul>${(rel[LANG] || rel.fr).map(x => '<li></li>').join('')}</ul>`;
    d.querySelectorAll('li').forEach((li, j) => { li.textContent = (rel[LANG] || rel.fr)[j]; });
    box.appendChild(d);
  });
}
let RELEASES = null;
function showWhatsNew(){
  const rel = RELEASES && RELEASES.find(x => x.version === APP_VERSION); if (!rel) return;
  $('m-title').textContent = tr('whatsnew') + ' · v' + rel.version; $('m-ok').textContent = tr('ok');
  $('m-list').innerHTML = ''; (rel[LANG] || rel.fr).forEach(x => { const li = document.createElement('li'); li.textContent = x; $('m-list').appendChild(li); });
  $('modal').classList.add('on');
}
$('m-ok').onclick = () => $('modal').classList.remove('on');
fetch('releases.json', {cache: 'no-cache'}).then(r => r.json()).then(j => {
  RELEASES = j; renderSettings();
  // nouvelle version depuis la dernière ouverture : on affiche les nouveautés (rien à la toute première ouverture)
  let seen = null; try { seen = localStorage.getItem('seenVersion'); } catch (e) {}
  if (seen && seen !== APP_VERSION) showWhatsNew();
  try { localStorage.setItem('seenVersion', APP_VERSION); } catch (e) {}
}).catch(() => {});
applyLang();
// Mise à jour automatique : le service worker est vérifié à chaque ouverture ; si une nouvelle version
// prend le relais, la page se recharge une fois toute seule.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg => reg.update()).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
}
</script>
