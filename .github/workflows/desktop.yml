name: Édition PC (installateurs)
# Lancement à la main (onglet Actions → « Édition PC » → Run workflow) ou en poussant un tag vX.Y.Z.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: platforms/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'      # pas de signature de code (installateurs non signés)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: accordeur-pc-${{ matrix.os }}
          path: |
            platforms/desktop/release/*.exe
            platforms/desktop/release/*.dmg
            platforms/desktop/release/*.AppImage
            platforms/desktop/release/*.deb
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/* }
